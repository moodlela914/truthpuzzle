/** * 音效處理模組 (Web Audio API)
 * 完全原生，不需外部檔案，產生清脆的 UI 點擊聲
 */
let audioCtx;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function playClickSound() {
    try {
        initAudio();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        // 設定波形與頻率 (輕快的音調)
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);

        // 設定音量衰減 (快速的 Pop 聲)
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.1);
    } catch (e) {
        console.log("Audio not supported or blocked by browser.");
    }
}

// 遊戲狀態控制
let currentState = { character: null, scene: null };

/** * 切換顯示畫面，徹底使用 style.display 避免 CSS 權重衝突 
 */
function switchScreen(id) {
    const screens = ['character-selection', 'game-scene', 'ending-screen'];
    screens.forEach(s => {
        document.getElementById(s).style.display = 'none';
        document.getElementById(s).classList.remove('scene-entry'); // 重置動畫
    });
    
    const target = document.getElementById(id);
    target.style.display = 'block';
    
    // 強制觸發重繪以重啟 CSS 動畫
    void target.offsetWidth; 
    target.classList.add('scene-entry');
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function startGame(characterId) {
    playClickSound(); // 觸發音效
    currentState.character = characterId;
    // Stage 1 為選角，正式開始為 Stage 2 (scene 2)
    renderScene('c' + (characterId === 'platform' ? '1' : characterId === 'promoter' ? '2' : '3') + '_s2');
    switchScreen('game-scene');
}

function renderScene(sceneId) {
    const charData = gameData[currentState.character];
    const sceneData = charData.scenes[sceneId];
    
    if (!sceneData) {
        console.error('Missing scene data:', sceneId);
        return;
    }

    currentState.scene = sceneId;
    
    // 更新文字與介面
    document.getElementById('role-badge').innerText = charData.name;
    document.getElementById('scene-title').innerText = sceneData.title;
    document.getElementById('story-text').innerText = sceneData.text;
    document.getElementById('tip-text').innerText = sceneData.tip;
    
    // 精確計算 6 階段進度 (S1=選角, S2~S5=劇情, S6=結局)
    let stage = 2;
    if (sceneId.includes('_s3_')) stage = 3;
    if (sceneId.includes('_s4_')) stage = 4;
    if (sceneId.includes('_s5_')) stage = 5;
    
    document.getElementById('scene-indicator').innerText = `STAGE ${stage}/6`;
    document.getElementById('progress-inner').style.width = `${(stage / 6) * 100}%`;

    // 渲染三個無提示的決策按鈕
    const container = document.getElementById('options-container');
    container.innerHTML = '';
    sceneData.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "game-button w-full py-5 px-8 rounded-2xl text-left bg-slate-800/90 text-lg md:text-xl font-bold text-slate-100 shadow-lg";
        btn.innerText = opt.text;
        btn.onclick = () => {
            playClickSound(); // 觸發音效
            if (opt.next.startsWith('end_')) {
                renderEnding(opt.next);
            } else {
                renderScene(opt.next);
            }
        };
        container.appendChild(btn);
    });
}

function renderEnding(endingId) {
    const data = endings[endingId];
    document.getElementById('ending-title').innerText = data.title;
    document.getElementById('ending-text').innerText = data.text;
    document.getElementById('reflection-text').innerText = data.reflection;
    
    // 抵達最終階段
    document.getElementById('scene-indicator') ? document.getElementById('scene-indicator').innerText = 'STAGE 6/6' : null;
    document.getElementById('progress-inner').style.width = '100%';
    
    switchScreen('ending-screen');
}

function restartGame() {
    playClickSound(); // 觸發音效
    currentState = { character: null, scene: null };
    switchScreen('character-selection');
}

// 初始啟動
window.onload = () => {
    switchScreen('character-selection');
};
</script>
